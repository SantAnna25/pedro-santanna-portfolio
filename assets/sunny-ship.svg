<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900">
  <defs>
    <linearGradient id="sail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3d2"/>
      <stop offset=".55" stop-color="#f2dfb4"/>
      <stop offset="1" stop-color="#d9bf8b"/>
    </linearGradient>
    <linearGradient id="sailBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c294"/>
      <stop offset="1" stop-color="#b39a6c"/>
    </linearGradient>
    <linearGradient id="hullSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9d5f2e"/>
      <stop offset="1" stop-color="#5d3013"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#caa062"/>
      <stop offset="1" stop-color="#8e5c2c"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx=".5" cy=".45" r=".62">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".38"/>
    </radialGradient>
  </defs>

  <g id="ship" transform="translate(450 470)">

    <!-- reflection on the water -->
    <ellipse cx="0" cy="205" rx="245" ry="52" fill="#0a3d4a" opacity=".5"/>

    <!-- hull underside / side seen from behind-above -->
    <path d="M -150 120 C -168 60 -168 -20 -140 -95 C -120 -150 -80 -185 -30 -196 L 30 -196 C 80 -185 120 -150 140 -95 C 168 -20 168 60 150 120 C 120 150 70 162 0 162 C -70 162 -120 150 -150 120 Z" fill="url(#hullSide)"/>
    <!-- stern transom facing the viewer -->
    <path d="M -150 120 C -100 150 100 150 150 120 L 150 92 C 100 122 -100 122 -150 92 Z" fill="#4a2410"/>
    <!-- warm rim light along the top edge of the hull -->
    <path d="M -150 118 C -166 60 -166 -20 -138 -94 C -118 -148 -79 -183 -30 -194 L 30 -194 C 79 -183 118 -148 138 -94 C 166 -20 166 60 150 118" fill="none" stroke="#e8b877" stroke-opacity=".55" stroke-width="7" stroke-linecap="round"/>

    <!-- deck, seen from above, receding to the bow -->
    <path d="M -132 106 C -148 54 -148 -18 -122 -86 C -102 -136 -66 -168 -26 -178 L 26 -178 C 66 -168 102 -136 122 -86 C 148 -18 148 54 132 106 C 92 128 -92 128 -132 106 Z" fill="url(#deck)"/>
    <!-- deck planking -->
    <g stroke="#7a4a20" stroke-opacity=".5" stroke-width="3">
      <path d="M -118 100 L -114 -80"/><path d="M -92 112 L -88 -142"/>
      <path d="M -62 116 L -58 -160"/><path d="M -30 118 L -27 -170"/>
      <path d="M 2 118 L 2 -172"/><path d="M 34 118 L 31 -170"/>
      <path d="M 66 116 L 62 -158"/><path d="M 96 110 L 92 -136"/>
    </g>
    <!-- bulwarks catching light -->
    <path d="M -132 106 C -148 54 -148 -18 -122 -86 C -102 -136 -66 -168 -26 -178" fill="none" stroke="#f0cf94" stroke-opacity=".8" stroke-width="8" stroke-linecap="round"/>
    <path d="M 132 106 C 148 54 148 -18 122 -86 C 102 -136 66 -168 26 -178" fill="none" stroke="#e8c184" stroke-opacity=".7" stroke-width="8" stroke-linecap="round"/>

    <!-- stern deckhouse -->
    <path d="M -92 84 L -84 34 C -60 24 60 24 84 34 L 92 84 C 60 96 -60 96 -92 84 Z" fill="#a5642e"/>
    <path d="M -84 34 C -60 24 60 24 84 34 L 82 44 C 58 34 -58 34 -82 44 Z" fill="#e2b478"/>
    <!-- windows -->
    <g fill="#2b1508" opacity=".85">
      <rect x="-64" y="52" width="16" height="18" rx="4"/>
      <rect x="-34" y="48" width="16" height="18" rx="4"/>
      <rect x="-4" y="46" width="16" height="18" rx="4"/>
      <rect x="26" y="48" width="16" height="18" rx="4"/>
      <rect x="56" y="52" width="16" height="18" rx="4"/>
    </g>

    <!-- lion figurehead at the bow (far end) -->
    <g transform="translate(0 -196)">
      <circle r="26" fill="url(#sunGlow)"/>
      <path d="M -20 -6 C -26 -22 -12 -30 0 -30 C 12 -30 26 -22 20 -6 C 22 6 12 14 0 14 C -12 14 -22 6 -20 -6 Z" fill="#f2c14e"/>
      <circle cx="-7" cy="-4" r="2.6" fill="#3a2408"/><circle cx="7" cy="-4" r="2.6" fill="#3a2408"/>
      <path d="M -8 6 C -4 10 4 10 8 6 C 4 4 -4 4 -8 6 Z" fill="#3a2408"/>
      <!-- mane rays -->
      <g stroke="#ffd97a" stroke-width="4" stroke-linecap="round" stroke-opacity=".9">
        <path d="M 0 -34 V -44"/><path d="M 20 -26 L 28 -34"/><path d="M -20 -26 L -28 -34"/>
        <path d="M 28 -6 L 38 -8"/><path d="M -28 -6 L -38 -8"/>
      </g>
    </g>

    <!-- masts: taller further back (near viewer), shorter forward -->
    <!-- forward mast -->
    <g>
      <rect x="-5" y="-330" width="10" height="220" fill="#8a5a2b"/>
      <!-- forward sail -->
      <path d="M -78 -326 L 78 -326 L 66 -196 C 30 -186 -30 -186 -66 -196 Z" fill="url(#sailBack)"/>
      <path d="M -78 -326 L 78 -326 L 74 -306 L -74 -306 Z" fill="#c9ab77"/>
      <!-- yard -->
      <rect x="-92" y="-334" width="184" height="10" rx="5" fill="#7a4a20"/>
    </g>

    <!-- main mast -->
    <g>
      <rect x="-6" y="-410" width="12" height="300" fill="#7d4d22"/>
      <!-- main topsail (upper) -->
      <path d="M -92 -404 L 92 -404 L 80 -292 C 36 -282 -36 -282 -80 -292 Z" fill="url(#sail)"/>
      <path d="M -92 -404 L 92 -404 L 88 -382 L -88 -382 Z" fill="#c2a068"/>
      <rect x="-108" y="-412" width="216" height="11" rx="5" fill="#6d4020"/>
      <!-- crow's nest / top platform -->
      <ellipse cx="0" cy="-286" rx="34" ry="9" fill="#5e3719"/>
      <!-- main sail (lower, closer) -->
      <path d="M -120 -276 L 120 -276 L 104 -120 C 48 -106 -48 -106 -104 -120 Z" fill="url(#sail)"/>
      <path d="M -120 -276 L 120 -276 L 115 -248 L -115 -248 Z" fill="#c2a068"/>
      <rect x="-138" y="-286" width="276" height="13" rx="6" fill="#6d4020"/>
      <!-- sun emblem on the main sail -->
      <g transform="translate(0 -206)" opacity=".95">
        <circle r="34" fill="#fff6de"/>
        <circle r="26" fill="#f6c04c"/>
        <g stroke="#e09a2c" stroke-width="6" stroke-linecap="round">
          <path d="M 0 -46 V -58"/><path d="M 32 -32 L 41 -41"/><path d="M 46 0 H 58"/>
          <path d="M 32 32 L 41 41"/><path d="M 0 46 V 58"/><path d="M -32 32 L -41 41"/>
          <path d="M -46 0 H -58"/><path d="M -32 -32 L -41 -41"/>
        </g>
      </g>
    </g>

    <!-- rigging lines -->
    <g stroke="#4b2c12" stroke-opacity=".7" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M -92 -276 L -128 -60"/><path d="M 92 -276 L 128 -60"/>
      <path d="M -78 -326 L -118 -84"/><path d="M 78 -326 L 118 -84"/>
      <path d="M 0 -410 L 0 -180"/>
    </g>

    <!-- sea foam hugging the waterline -->
    <g fill="#e9f6fb" opacity=".8">
      <ellipse cx="-150" cy="122" rx="34" ry="12"/>
      <ellipse cx="150" cy="122" rx="34" ry="12"/>
      <ellipse cx="0" cy="160" rx="120" ry="18" opacity=".6"/>
    </g>
    <g fill="#e9f6fb" opacity=".55">
      <ellipse cx="-196" cy="150" rx="20" ry="8"/>
      <ellipse cx="196" cy="150" rx="20" ry="8"/>
      <ellipse cx="-238" cy="176" rx="13" ry="6"/>
      <ellipse cx="238" cy="176" rx="13" ry="6"/>
    </g>
  </g>

  <rect width="900" height="900" fill="url(#vign)"/>
</svg>
